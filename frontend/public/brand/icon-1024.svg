<svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --bronze-start: #1b1204;
      --bronze-end: #352207;
      --gold-strong: #fde68a;
      --gold-main: #d4af37;
      --gold-deep: #a76f0f;
      --gold-soft: rgba(212, 175, 55, 0.34);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bronze-start: #120b02;
        --bronze-end: #271704;
        --gold-strong: #fff1ad;
        --gold-main: #e6bd45;
        --gold-deep: #b8860b;
        --gold-soft: rgba(253, 230, 138, 0.4);
      }
    }
  </style>

  <rect width="1024" height="1024" rx="224" fill="url(#bronzeBg)" />
  <rect x="18" y="18" width="988" height="988" rx="208" stroke="url(#edgeGold)" stroke-width="24" />

  <circle cx="512" cy="512" r="420" stroke="var(--gold-soft)" stroke-width="22" />
  <circle cx="512" cy="512" r="364" stroke="rgba(253, 230, 138, 0.42)" stroke-width="34" stroke-dasharray="72 28" />
  <circle cx="512" cy="512" r="302" fill="url(#mirrorFace)" stroke="rgba(253, 230, 138, 0.62)" stroke-width="14" />

  <path d="M512 104v76M512 844v76M104 512h76M844 512h76" stroke="rgba(253, 230, 138, 0.56)" stroke-width="28" stroke-linecap="round" />
  <path d="M233 233l54 54M737 737l54 54M791 233l-54 54M287 737l-54 54" stroke="rgba(212, 175, 55, 0.36)" stroke-width="20" stroke-linecap="round" />

  <text x="512" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="268" font-weight="800" fill="url(#goldText)" letter-spacing="-8">98</text>
  <text x="512" y="624" text-anchor="middle" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="88" font-weight="700" fill="rgba(253, 230, 138, 0.86)" letter-spacing="8">优秀</text>

  <circle cx="512" cy="512" r="26" fill="url(#goldKnob)" opacity="0.95" />

  <defs>
    <linearGradient id="bronzeBg" x1="124" y1="88" x2="900" y2="936" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--bronze-start)" />
      <stop offset="1" stop-color="var(--bronze-end)" />
    </linearGradient>
    <linearGradient id="edgeGold" x1="148" y1="108" x2="876" y2="916" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--gold-strong)" />
      <stop offset="0.46" stop-color="var(--gold-main)" />
      <stop offset="1" stop-color="var(--gold-deep)" />
    </linearGradient>
    <radialGradient id="mirrorFace" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(395 350) rotate(54) scale(485)">
      <stop stop-color="#3e2a08" />
      <stop offset="0.58" stop-color="#261804" />
      <stop offset="1" stop-color="#130b02" />
    </radialGradient>
    <linearGradient id="goldText" x1="330" y1="284" x2="704" y2="624" gradientUnits="userSpaceOnUse">
      <stop stop-color="var(--gold-strong)" />
      <stop offset="0.48" stop-color="var(--gold-main)" />
      <stop offset="1" stop-color="var(--gold-deep)" />
    </linearGradient>
    <radialGradient id="goldKnob" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(502 500) rotate(57) scale(48)">
      <stop stop-color="#fff4bd" />
      <stop offset="1" stop-color="var(--gold-main)" />
    </radialGradient>
  </defs>
</svg>
