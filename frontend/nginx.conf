server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ES module workers (pdf.js, etc.) ship as .mjs. The default nginx
  # mime.types lacks this mapping, so browsers reject the import() with
  # "Failed to fetch dynamically imported module". A location-scoped
  # type override avoids replacing the global mime map.
  location ~ \.mjs$ {
    types { application/javascript mjs; }
    default_type application/javascript;
  }

  # Local health probe for docker-compose healthcheck.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Vite SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
