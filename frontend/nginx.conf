server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Local health probe for docker-compose healthcheck.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Vite SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
