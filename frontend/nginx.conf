server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Content-hashed build assets (Vite emits new filenames on every change),
  # so they can be cached forever. Exact matches like /sw.js take priority
  # over this regex, so the service worker is not caught here.
  location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ES module workers (pdf.js, etc.) ship as .mjs. The default nginx
  # mime.types lacks this mapping, so browsers reject the import() with
  # "Failed to fetch dynamically imported module". A location-scoped
  # type override avoids replacing the global mime map. These are also
  # content-hashed, so cache them immutably too.
  location ~ \.mjs$ {
    types { application/javascript mjs; }
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The service worker must always be revalidated so a new deploy is detected
  # promptly (it is the gate that controls which precached build users see).
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Local health probe for docker-compose healthcheck.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Vite SPA history fallback. index.html must never be cached so every load
  # picks up the latest hashed-bundle references after a deploy.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
