services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    env_file:
      - ${APP_ROOT}/shared/env/database.env
    volumes:
      - exam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  judge_runner:
    build:
      context: ./backend
      dockerfile: judge-runner.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  lsp_runner:
    build:
      context: ./backend
      dockerfile: lsp-runner.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
        INSTALL_JDTLS: ${INSTALL_JDTLS:-0}
        JDTLS_BASE_URL: ${JDTLS_BASE_URL:-https://download.eclipse.org/jdtls/milestones}
        JDTLS_CONNECT_TIMEOUT: ${JDTLS_CONNECT_TIMEOUT:-30}
        JDTLS_MAX_TIME: ${JDTLS_MAX_TIME:-1800}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=5)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  backend_blue:
    &backend_app
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        CHROMIUM_FOR_TESTING_DOWNLOAD_HOST: ${CHROMIUM_FOR_TESTING_DOWNLOAD_HOST:-https://cdn.npmmirror.com/binaries/chrome-for-testing}
    restart: unless-stopped
    init: true
    shm_size: "512mb"
    env_file:
      - ${APP_ROOT}/shared/env/backend.env
    environment:
      EXAM_JUDGE_RUNNER_URL: http://judge_runner:8010
      EXAM_LSP_RUNNER_URL: http://lsp_runner:8020
      EXAM_CHAOXING_LOCK_PATH: /run/chaoxing/connector.lock
      EXAM_CHAOXING_BROWSER_EXECUTABLE: /usr/local/bin/chaoxing-chromium
    volumes:
      - ${APP_ROOT}/shared/uploads:/app/uploads
      - exam_chaoxing_lock:/run/chaoxing
    depends_on:
      db:
        condition: service_healthy
      judge_runner:
        condition: service_healthy
      lsp_runner:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  backend_green:
    <<: *backend_app

  frontend_blue:
    &frontend_app
    build:
      context: ./frontend
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        FRONTEND_NGINX_IMAGE: ${FRONTEND_NGINX_IMAGE:-nginx:1.27-alpine}
        PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend_green:
    <<: *frontend_app

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3036:3036"
    volumes:
      # scripts/deploy.sh renders the active upstream here during each release.
      - ${APP_ROOT}/shared/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3036/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  exam_postgres_data:
  exam_chaoxing_lock:
