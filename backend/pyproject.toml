[project]
name = "exam-backend"
version = "0.1.0"
description = "AI Exam Grading System Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "pdfplumber>=0.11.9",
    "python-docx>=1.2.0",
    "aiosqlite>=0.22.1",
    "anthropic>=0.95.0",
    "bilibili-api-python>=17.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast unit-level tests that do not require external services",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.black]
line-length = 120
target-version = ["py312"]
